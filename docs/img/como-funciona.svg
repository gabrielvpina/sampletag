<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Como o SampleTag funciona em equipe</title>
  <desc id="d">Infográfico em quatro etapas: 1) quem coordena cria o modelo de ficha e o envia aos celulares; 2) cada pessoa coleta no campo sem internet, com GPS, fotos, etiqueta com QR e amostras técnicas; 3) quando há sinal, cada uma envia seu backup ZIP e quem coordena importa tudo num só celular, sem códigos repetidos; 4) os dados são exportados como relatório HTML, planilha CSV, KML, etiquetas PDF e backup ZIP.</desc>
  <defs>
    <symbol id="phone" viewBox="0 0 90 160">
      <rect width="90" height="160" rx="14" fill="#1D241E"/>
      <rect x="6" y="14" width="78" height="134" rx="6" fill="#FFFFFF"/>
      <rect x="35" y="5" width="20" height="4" rx="2" fill="#4A544B"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5B665C"/>
    </marker>
    <g id="next">
      <circle r="18" fill="#A8B08C" stroke="#F6F7F2" stroke-width="4"/>
      <path d="M-4 -7L4 0L-4 7" fill="none" stroke="#1D241E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1200" height="820" rx="20" fill="#F6F7F2"/>

  <!-- Título -->
  <g transform="translate(30 30)">
    <rect width="52" height="52" rx="12" fill="#3D5C40"/>
    <g transform="scale(0.4815)">
      <path d="M76 32C58 28 36 40 36 68C62 72 78 52 76 32Z" fill="#B5C08F"/>
      <path d="M39 65Q55 51 72 36" fill="none" stroke="#3D5C40" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M37 67L31.5 72.5" fill="none" stroke="#B5C08F" stroke-width="3" stroke-linecap="round"/>
      <g transform="rotate(-14 62 72.5)"><path d="M50 72.5L56 65.5H73a2 2 0 0 1 2 2V77.5a2 2 0 0 1-2 2H56Z" fill="#F2C230"/><circle cx="56.6" cy="72.5" r="1.9" fill="#3D5C40"/></g>
    </g>
  </g>
  <text x="98" y="56" font-size="28" font-weight="800" fill="#1D241E">Como o SampleTag funciona em equipe</text>
  <text x="98" y="82" font-size="15" fill="#5B665C">Coleta sem internet em vários celulares Android · dados juntados sem códigos repetidos · exportação em vários formatos</text>

  <!-- Cartões das etapas -->
  <g fill="#FFFFFF" stroke="#D9DDCF" stroke-width="1.5">
    <rect x="30" y="120" width="270" height="540" rx="16"/>
    <rect x="320" y="120" width="270" height="540" rx="16"/>
    <rect x="610" y="120" width="270" height="540" rx="16"/>
    <rect x="900" y="120" width="270" height="540" rx="16"/>
  </g>
  <g font-size="20" font-weight="800" fill="#1D241E">
    <circle cx="62" cy="153" r="16" fill="#3D5C40"/><text x="62" y="160" text-anchor="middle" fill="#fff" font-size="17">1</text>
    <text x="88" y="160">Preparar</text>
    <circle cx="352" cy="153" r="16" fill="#3D5C40"/><text x="352" y="160" text-anchor="middle" fill="#fff" font-size="17">2</text>
    <text x="378" y="160">Coletar no campo</text>
    <circle cx="642" cy="153" r="16" fill="#3D5C40"/><text x="642" y="160" text-anchor="middle" fill="#fff" font-size="17">3</text>
    <text x="668" y="160">Juntar os dados</text>
    <circle cx="932" cy="153" r="16" fill="#3D5C40"/><text x="932" y="160" text-anchor="middle" fill="#fff" font-size="17">4</text>
    <text x="958" y="160">Exportar e usar</text>
  </g>

  <!-- 1. Preparar -->
  <g font-size="13.5" fill="#5B665C">
    <text x="48" y="192">Quem coordena cria o modelo</text>
    <text x="48" y="210">de ficha (campos, prefixo, cor).</text>
  </g>
  <use href="#phone" x="120" y="226" width="90" height="160"/>
  <rect x="126" y="240" width="78" height="20" fill="#3D5C40"/>
  <text x="165" y="254" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">Modelo Cacau</text>
  <g font-size="8" fill="#5B665C">
    <text x="132" y="276">Prefixo</text><rect x="132" y="280" width="66" height="10" rx="2" fill="#EEF1E6"/><text x="135" y="288" font-weight="700" fill="#1D241E">CAC</text>
    <text x="132" y="303">Tecido</text><rect x="132" y="307" width="66" height="10" rx="2" fill="#EEF1E6"/><text x="135" y="315">lista ▾</text>
    <text x="132" y="330">Nº da planta</text><rect x="132" y="334" width="66" height="10" rx="2" fill="#EEF1E6"/><text x="135" y="342">número</text>
    <text x="132" y="357">Sanidade</text><rect x="132" y="361" width="66" height="10" rx="2" fill="#EEF1E6"/><text x="135" y="369">lista ▾</text>
  </g>
  <rect x="48" y="404" width="234" height="40" rx="9" fill="#FFF6D9" stroke="#E5BE3C" stroke-width="1.5"/>
  <path d="M62 413h11l5 5v17h-16z" fill="#fff" stroke="#9A7A12" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M73 413v5h5" fill="none" stroke="#9A7A12" stroke-width="1.4"/>
  <text x="86" y="429" font-size="11.5" font-weight="700" fill="#5E4A07">SampleTag_Modelo_Cacau.json</text>
  <g font-size="13.5" fill="#1D241E">
    <text x="48" y="472">Enviado por WhatsApp ou e-mail.</text>
    <text x="48" y="492">Cada celular importa o modelo</text>
    <text x="48" y="512">e define seu código de coletor:</text>
  </g>
  <g font-size="13" font-weight="800" fill="#fff" text-anchor="middle">
    <rect x="60" y="526" width="56" height="28" rx="14" fill="#3D5C40"/><text x="88" y="545">AS</text>
    <rect x="126" y="526" width="56" height="28" rx="14" fill="#2F6E8F"/><text x="154" y="545">JL</text>
    <rect x="192" y="526" width="56" height="28" rx="14" fill="#9A5B00"/><text x="220" y="545">MC</text>
  </g>
  <g font-size="13" fill="#5B665C">
    <text x="48" y="592">Todos usam a mesma ficha e</text>
    <text x="48" y="610">nenhum código se repete.</text>
  </g>

  <!-- 2. Coletar -->
  <rect x="336" y="176" width="238" height="28" rx="14" fill="#FBE9E5"/>
  <path d="M352 186a14 14 0 0 1 18 0M355 190a9 9 0 0 1 12 0" fill="none" stroke="#A23B2A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="361" cy="194" r="1.8" fill="#A23B2A"/>
  <path d="M351 182L371 198" stroke="#A23B2A" stroke-width="2" stroke-linecap="round"/>
  <text x="380" y="195" font-size="12.5" font-weight="700" fill="#A23B2A">Sem internet: tudo funciona</text>

  <use href="#phone" x="336" y="218" width="70" height="124"/>
  <use href="#phone" x="420" y="218" width="70" height="124"/>
  <use href="#phone" x="504" y="218" width="70" height="124"/>
  <g>
    <rect x="341" y="230" width="60" height="46" fill="#DCE5EA"/>
    <path d="M341 262l14-10 12 7 13-12 21 8v21h-60z" fill="#C7D3B5"/>
    <circle cx="371" cy="250" r="6" fill="#3D5C40" stroke="#fff" stroke-width="2"/>
    <text x="371" y="290" font-size="7" font-weight="800" fill="#1D241E" text-anchor="middle">CAC-AS-0001</text>
    <rect x="352" y="297" width="38" height="13" rx="6.5" fill="#E7F0E3"/><text x="371" y="307" font-size="8" fill="#3D5C40" text-anchor="middle" font-weight="700">±4 m</text>
    <rect x="347" y="316" width="48" height="16" rx="3" fill="#F2C230"/><text x="371" y="327" font-size="7.5" font-weight="700" fill="#1D241E" text-anchor="middle">ETIQUETA</text>

    <rect x="425" y="230" width="60" height="46" fill="#DCE5EA"/>
    <path d="M425 266l16-12 10 6 15-9 19 10v17h-60z" fill="#C7D3B5"/>
    <circle cx="455" cy="252" r="6" fill="#2F6E8F" stroke="#fff" stroke-width="2"/>
    <text x="455" y="290" font-size="7" font-weight="800" fill="#1D241E" text-anchor="middle">CAC-JL-0001</text>
    <rect x="436" y="297" width="38" height="13" rx="6.5" fill="#E7F0E3"/><text x="455" y="307" font-size="8" fill="#3D5C40" text-anchor="middle" font-weight="700">±6 m</text>
    <rect x="431" y="316" width="48" height="16" rx="3" fill="#F2C230"/><text x="455" y="327" font-size="7.5" font-weight="700" fill="#1D241E" text-anchor="middle">ETIQUETA</text>

    <rect x="509" y="230" width="60" height="46" fill="#DCE5EA"/>
    <path d="M509 260l12-6 14 9 12-10 23 9v24h-61z" fill="#C7D3B5"/>
    <circle cx="539" cy="248" r="6" fill="#9A5B00" stroke="#fff" stroke-width="2"/>
    <text x="539" y="290" font-size="7" font-weight="800" fill="#1D241E" text-anchor="middle">CAC-MC-0001</text>
    <rect x="520" y="297" width="38" height="13" rx="6.5" fill="#E7F0E3"/><text x="539" y="307" font-size="8" fill="#3D5C40" text-anchor="middle" font-weight="700">±3 m</text>
    <rect x="515" y="316" width="48" height="16" rx="3" fill="#F2C230"/><text x="539" y="327" font-size="7.5" font-weight="700" fill="#1D241E" text-anchor="middle">ETIQUETA</text>
  </g>
  <g font-size="12" font-weight="700" fill="#1D241E" text-anchor="middle">
    <text x="371" y="360">Ana (AS)</text>
    <text x="455" y="360">João (JL)</text>
    <text x="539" y="360">Maria (MC)</text>
  </g>
  <g fill="#3D5C40">
    <circle cx="344" cy="388" r="4"/><circle cx="344" cy="412" r="4"/><circle cx="344" cy="436" r="4"/>
    <circle cx="344" cy="460" r="4"/><circle cx="344" cy="484" r="4"/><circle cx="344" cy="508" r="4"/>
    <circle cx="344" cy="550" r="4"/>
  </g>
  <g font-size="13.5" fill="#1D241E">
    <text x="356" y="393">GPS automático, com precisão</text>
    <text x="356" y="417">Município/UF mesmo sem sinal</text>
    <text x="356" y="441">Fotos e campos do modelo</text>
    <text x="356" y="465">Etiqueta impressa com QR code</text>
    <text x="356" y="489">Ler o QR abre a ficha na hora</text>
    <text x="356" y="513">Amostras técnicas (DNA, RNA…)</text>
    <text x="356" y="531" fill="#5B665C">derivadas da amostra de origem</text>
    <text x="356" y="555">Rascunho salvo sozinho</text>
  </g>
  <rect x="336" y="576" width="238" height="62" rx="10" fill="#F6F7F2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1D241E">
    <text x="348" y="600" font-weight="700">CAC-AS-2026-0001</text>
    <text x="348" y="624" fill="#5B665C">└ CAC-AS-2026-0001-01</text>
  </g>

  <!-- 3. Juntar -->
  <g font-size="13.5" fill="#5B665C">
    <text x="628" y="192">Quando houver sinal, cada um</text>
    <text x="628" y="210">envia seu backup (ZIP).</text>
  </g>
  <g font-size="12" font-weight="800" fill="#fff" text-anchor="middle">
    <rect x="628" y="226" width="70" height="34" rx="8" fill="#3D5C40"/><text x="663" y="248">AS.zip</text>
    <rect x="710" y="226" width="70" height="34" rx="8" fill="#2F6E8F"/><text x="745" y="248">JL.zip</text>
    <rect x="792" y="226" width="70" height="34" rx="8" fill="#9A5B00"/><text x="827" y="248">MC.zip</text>
  </g>
  <g fill="none" stroke="#5B665C" stroke-width="2" marker-end="url(#arrow)">
    <path d="M663 262C663 284 720 280 735 300"/>
    <path d="M745 262V298"/>
    <path d="M827 262C827 284 770 280 755 300"/>
  </g>
  <use href="#phone" x="700" y="304" width="90" height="160"/>
  <rect x="706" y="318" width="78" height="20" fill="#3D5C40"/>
  <text x="745" y="332" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Importar coleta</text>
  <g font-size="8.5" fill="#1D241E">
    <text x="712" y="356">Novas</text><text x="778" y="356" text-anchor="end" font-weight="800" fill="#2E7D32">120</text>
    <line x1="712" y1="362" x2="778" y2="362" stroke="#E3E6DA"/>
    <text x="712" y="378">Atualizadas</text><text x="778" y="378" text-anchor="end" font-weight="800">4</text>
    <line x1="712" y1="384" x2="778" y2="384" stroke="#E3E6DA"/>
    <text x="712" y="400">Iguais</text><text x="778" y="400" text-anchor="end" font-weight="800">18</text>
    <line x1="712" y1="406" x2="778" y2="406" stroke="#E3E6DA"/>
    <text x="712" y="422">Repetidas</text><text x="778" y="422" text-anchor="end" font-weight="800" fill="#9A5B00">0</text>
  </g>
  <rect x="712" y="430" width="66" height="14" rx="7" fill="#3D5C40"/>
  <text x="745" y="440" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">IMPORTAR</text>
  <g fill="#3D5C40">
    <circle cx="634" cy="494" r="4"/><circle cx="634" cy="518" r="4"/><circle cx="634" cy="560" r="4"/><circle cx="634" cy="584" r="4"/>
  </g>
  <g font-size="13.5" fill="#1D241E">
    <text x="646" y="499">Prévia antes de importar</text>
    <text x="646" y="523">Código repetido? Renomear,</text>
    <text x="646" y="541">pular ou substituir</text>
    <text x="646" y="565">Importar de novo não duplica</text>
    <text x="646" y="589">Fotos vêm junto; os ajustes</text>
    <text x="646" y="607">de cada celular não mudam</text>
  </g>

  <!-- 4. Exportar -->
  <g font-size="13.5" fill="#5B665C">
    <text x="918" y="192">Num toque, pela opção de</text>
    <text x="918" y="210">compartilhar do Android.</text>
  </g>
  <g fill="#F6F7F2" stroke="#D9DDCF" stroke-width="1.2">
    <rect x="916" y="226" width="238" height="70" rx="10"/>
    <rect x="916" y="306" width="238" height="70" rx="10"/>
    <rect x="916" y="386" width="238" height="70" rx="10"/>
    <rect x="916" y="466" width="238" height="70" rx="10"/>
    <rect x="916" y="546" width="238" height="70" rx="10"/>
  </g>
  <g font-size="11" font-weight="800" fill="#fff" text-anchor="middle">
    <rect x="928" y="239" width="44" height="44" rx="9" fill="#3D5C40"/><text x="950" y="265">HTML</text>
    <rect x="928" y="319" width="44" height="44" rx="9" fill="#2E7D32"/><text x="950" y="345">CSV</text>
    <rect x="928" y="399" width="44" height="44" rx="9" fill="#2F6E8F"/><text x="950" y="425">KML</text>
    <rect x="928" y="479" width="44" height="44" rx="9" fill="#B5432F"/><text x="950" y="505">PDF</text>
    <rect x="928" y="559" width="44" height="44" rx="9" fill="#6B5B3E"/><text x="950" y="585">ZIP</text>
  </g>
  <g font-size="14" font-weight="800" fill="#1D241E">
    <text x="984" y="250">Relatório HTML</text>
    <text x="984" y="330">Planilha CSV</text>
    <text x="984" y="410">Mapa KML</text>
    <text x="984" y="490">Etiquetas PDF</text>
    <text x="984" y="570">Backup ZIP</text>
  </g>
  <g font-size="11.5" fill="#5B665C">
    <text x="984" y="268">Mapa, tabela, fichas e fotos.</text>
    <text x="984" y="284">Abre até sem internet.</text>
    <text x="984" y="348">Excel, LibreOffice, R</text>
    <text x="984" y="364">ou Python.</text>
    <text x="984" y="428">Google Earth e QGIS.</text>
    <text x="984" y="508">50×30 mm, 100×70 mm</text>
    <text x="984" y="524">ou folha A4.</text>
    <text x="984" y="588">Cópia completa, com</text>
    <text x="984" y="604">fotos e modelos.</text>
  </g>

  <!-- Setas entre etapas -->
  <use href="#next" x="310" y="390"/>
  <use href="#next" x="600" y="390"/>
  <use href="#next" x="890" y="390"/>

  <!-- Faixa inferior -->
  <rect x="30" y="680" width="1140" height="110" rx="16" fill="#3D5C40"/>
  <g font-size="15" font-weight="800" fill="#FFFFFF">
    <text x="60" y="716">Offline de verdade</text>
    <text x="440" y="716">Sem códigos repetidos</text>
    <text x="820" y="716">Seus dados com você</text>
  </g>
  <g font-size="13" fill="#E9ECDD">
    <text x="60" y="740">Internet só para enviar os arquivos e,</text>
    <text x="60" y="760">se quiser, ver o mapa de satélite.</text>
    <text x="440" y="740">Cada coletor tem seu código (AS, JL…)</text>
    <text x="440" y="760">e a importação confere tudo antes.</text>
    <text x="820" y="740">Nada sai do celular sem você escolher</text>
    <text x="820" y="760">para onde enviar.</text>
  </g>
</svg>
