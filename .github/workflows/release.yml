# Publica os APKs numa Release do GitHub ao enviar uma tag "v*".
#
#   1. Ajuste "version:" no pubspec.yaml (ex.: 1.1.0+3) e faça commit.
#   2. git tag v1.1.0 && git push origin v1.1.0
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   keystore de upload em base64
#   ANDROID_KEYSTORE_PASSWORD senha do keystore
#   ANDROID_KEY_ALIAS         alias da chave (ex.: upload)
#   ANDROID_KEY_PASSWORD      senha da chave
name: Release Android

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Conferir versão da tag x pubspec
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          echo "tag=$TAG pubspec=$PUB"
          if [ "$TAG" != "$PUB" ]; then
            echo "::error::A tag v$TAG não bate com a versão $PUB do pubspec.yaml"; exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Segredo ANDROID_KEYSTORE_BASE64 ausente: o APK sairia com a chave de debug."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Compilar APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          V="${GITHUB_REF_NAME}"
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk    "../../../../dist/SampleTag-$V-arm64-v8a.apk"
          cp app-armeabi-v7a-release.apk  "../../../../dist/SampleTag-$V-armeabi-v7a.apk"
          cp app-x86_64-release.apk       "../../../../dist/SampleTag-$V-x86_64.apk"
          cp app-release.apk              "../../../../dist/SampleTag-$V-universal.apk"
          cd ../../../../dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **Qual APK baixar?**
          - \`arm64-v8a\`: a maioria dos celulares Android atuais (recomendado)
          - \`armeabi-v7a\`: celulares antigos, de 32 bits
          - \`universal\`: funciona em qualquer um (arquivo maior)

          Requer Android 7.0 ou superior. Na instalação, permita "instalar apps desconhecidos".
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SampleTag $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
